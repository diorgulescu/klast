[package]
name = "klast"
version = "0.2.0"
edition = "2021"
description = "An ultra-lightweight, text-first hybrid web browser for low-resource systems"

[dependencies]
eframe = "0.29"
scraper = "0.20"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "gzip", "deflate"] }
url = "2.5"
adblock = { version = "0.13", default-features = false, features = ["embedded-domain-resolver"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
