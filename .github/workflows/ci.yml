# SPDX-License-Identifier: GPL-3.0-or-later
name: CI — Automated Test Suite

on:
  push:
    branches: ["main", "master"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test-suite:
    name: Test Suite (${{ matrix.os }} / ${{ matrix.features_label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - features_flag: ""
            features_label: "default-features"
          - features_flag: "--no-default-features"
            features_label: "minimal-no-webview"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libx11-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libfontconfig1-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest' && matrix.features_flag == ''
        run: cargo fmt --all -- --check

      - name: Run Clippy linter
        run: cargo clippy ${{ matrix.features_flag }} --all-targets -- -D warnings

      - name: Run automated unit & integration tests
        run: cargo test ${{ matrix.features_flag }} --verbose

      - name: Verify CLI GPLv3 license and version output
        run: cargo run ${{ matrix.features_flag }} -- --version

  low-spec-targets-check:
    name: Low-Spec & musl Cross-Check (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - i686-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - armv7-unknown-linux-musleabihf
          - riscv64gc-unknown-linux-gnu

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain & target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Verify cross-target metadata & compilation check
        run: cargo check --target ${{ matrix.target }} --no-default-features
